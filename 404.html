<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada | Dental ISA</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .not-found-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 16px;
      background-color: var(--color-surface-light);
    }
    .not-found-card {
      max-width: 520px;
      background-color: var(--color-surface-white);
      border: 1px solid var(--color-border);
      border-radius: 24px;
      padding: 48px 32px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.05);
    }
    .not-found-code {
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      color: var(--color-brand-dark);
      margin-bottom: 16px;
      letter-spacing: -0.03em;
    }
  </style>
</head>
<body>
  <div class="not-found-wrapper">
    <div class="not-found-card">
      <img src="assets/images/logo.jpg" alt="Logo Dental ISA" style="width: 64px; height: 64px; border-radius: 9999px; margin-bottom: 24px;">
      <div class="not-found-code">404</div>
      <h1 class="text-2xl" style="margin-bottom: 12px; color: var(--color-brand-dark);">Página no encontrada</h1>
      <p class="text-sm" style="color: var(--color-text-muted); margin-bottom: 32px; line-height: 22px;">
        La página que buscas no existe o ha sido movida. Puedes regresar a la página principal o contactarnos directamente por WhatsApp.
      </p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-primary">Volver al inicio</a>
        <a href="https://api.whatsapp.com/send?phone=+526648098071" class="btn btn-outline">WhatsApp directo</a>
      </div>
    </div>
  </div>
</body>
</html>
